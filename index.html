<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-v2-192.png">
<meta name="theme-color" content="#0e1116">
<title>X 视频下载器</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬇️</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0e1116; color: #e6e9ef; min-height: 100vh;
    max-width: 560px; margin: 0 auto; padding: 16px 14px calc(24px + env(safe-area-inset-bottom));
  }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 2px 16px; }
  header .logo {
    width: 38px; height: 38px; border-radius: 11px; background: #1a1f27;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header p { font-size: 12px; color: #8b93a1; margin-top: 2px; }
  .card { background: #171b22; border: 1px solid #232a35; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  input#url {
    width: 100%; background: #0e1116; border: 1px solid #2a3240; border-radius: 10px;
    color: #e6e9ef; font-size: 15px; padding: 12px 12px; outline: none;
  }
  input#url:focus { border-color: #1d9bf0; }
  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  button {
    flex: 1; border: none; border-radius: 10px; padding: 12px 0; font-size: 15px;
    font-weight: 500; cursor: pointer; background: #232a35; color: #e6e9ef;
  }
  button.primary { background: #1d9bf0; color: #fff; }
  button.primary:active { background: #1888cc; }
  button:disabled { opacity: 0.55; }
  #msg { font-size: 13px; color: #f0a35e; padding: 0 4px; min-height: 20px; margin-bottom: 10px; }
  #msg.ok { color: #57c98a; }
  .tweet { display: flex; gap: 10px; margin-bottom: 12px; }
  .tweet img { width: 40px; height: 40px; border-radius: 50%; flex: none; }
  .tweet .name { font-size: 14px; font-weight: 600; }
  .tweet .handle { font-size: 12px; color: #8b93a1; }
  .tweet .text { font-size: 13px; color: #c3c9d4; margin-top: 5px; line-height: 1.55; word-break: break-word; }
  .vhead { display: flex; align-items: baseline; gap: 8px; margin: 4px 0 10px; }
  .vhead b { font-size: 14px; }
  .vhead span { font-size: 12px; color: #8b93a1; }
  .q {
    display: flex; align-items: center; gap: 10px; background: #171b22;
    border: 1px solid #232a35; border-radius: 12px; padding: 11px 12px; margin-bottom: 8px;
  }
  .q .info { flex: 1; min-width: 0; }
  .q .res { font-size: 15px; font-weight: 600; }
  .q .meta { font-size: 12px; color: #8b93a1; margin-top: 3px; }
  .q button.dl {
    flex: none; background: #1d9bf0; color: #fff; border-radius: 9px;
    padding: 9px 16px; font-size: 14px; min-width: 74px;
  }
  .q a.open {
    flex: none; color: #8b93a1; font-size: 12px; text-decoration: none; padding: 6px 2px;
  }
  .bar { height: 4px; background: #232a35; border-radius: 2px; overflow: hidden; margin-top: 7px; }
  .bar i { display: block; height: 100%; width: 0%; background: #1d9bf0; border-radius: 2px; transition: width .2s; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#e6e9ef"><path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3l-4.9-6.4L6.4 22H3.3l7.3-8.3L1.6 2h6.4l4.4 5.9L18.9 2zm-1.1 18h1.7L7.1 3.8H5.3L17.8 20z"/></svg>
  </div>
  <div>
    <h1>X 视频下载器</h1>
    <p>粘贴链接，选择清晰度，下载保存</p>
  </div>
</header>

<div class="card">
  <input id="url" type="url" placeholder="粘贴 X 视频分享链接" autocomplete="off">
  <div class="btn-row">
    <button id="pasteBtn" type="button">粘贴</button>
    <button id="parseBtn" class="primary" type="button">解析</button>
  </div>
</div>

<div id="msg"></div>
<div id="result"></div>

<script>
const $ = id => document.getElementById(id);
const input = $('url'), msg = $('msg'), result = $('result');

function setMsg(text, ok) {
  msg.textContent = text || '';
  msg.className = ok ? 'ok' : '';
  if (text && !ok) result.innerHTML = '';
}

function extractId(text) {
  const m = (text || '').match(/(?:x|twitter|fxtwitter|vxtwitter|fixupx|fixvx|twittpr)\.com\/[^\s]*?status\/(\d+)/i);
  return m ? m[1] : null;
}

function fmtSize(n) {
  if (!n && n !== 0) return '';
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}

function fmtDur(s) {
  s = Math.round(s || 0);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

async function parse() {
  const id = extractId(input.value.trim());
  if (!id) { setMsg('没识别到推文链接。需要形如 x.com/用户名/status/数字 的链接'); return; }
  setMsg('解析中…', true);
  $('parseBtn').disabled = true;
  try {
    const res = await fetch('https://api.fxtwitter.com/_/status/' + id);
    const data = await res.json();
    if (data.code !== 200 || !data.tweet) {
      setMsg('解析失败（' + (data.code || '网络') + '）：推文可能已删除、属于私密账号或含敏感内容'); return;
    }
    const t = data.tweet;
    const videos = ((t.media || {}).videos || []);
    if (!videos.length) { setMsg('这条推文里没有视频（可能只有图片或纯文字）'); return; }
    setMsg('解析成功，共 ' + videos.length + ' 个视频，请选择清晰度下载', true);
    render(t, videos, id);
  } catch (e) {
    setMsg('网络错误：' + e.message + '（如持续失败请检查网络）');
  } finally {
    $('parseBtn').disabled = false;
  }
}

function qualitiesOf(v) {
  let list = (v.formats || []).filter(f => f.container === 'mp4' && f.bitrate > 0);
  if (!list.length) list = (v.variants || []).filter(x => x.content_type === 'video/mp4' && x.bitrate > 0);
  return list.sort((a, b) => b.bitrate - a.bitrate);
}

function render(t, videos, tweetId) {
  const a = t.author || {};
  let html = '<div class="card"><div class="tweet">' +
    (a.avatar_url ? '<img src="' + a.avatar_url + '" referrerpolicy="no-referrer">' : '') +
    '<div><div class="name"></div><div class="handle">@' + (a.screen_name || '') + '</div>' +
    '<div class="text"></div></div></div></div>';
  result.innerHTML = html;
  result.querySelector('.name').textContent = a.name || '';
  result.querySelector('.text').textContent = t.text || '';

  videos.forEach((v, vi) => {
    const qs = qualitiesOf(v);
    if (!qs.length) return;
    const card = document.createElement('div');
    card.className = 'card';
    const dims = (v.width && v.height) ? v.width + 'x' + v.height : '';
    const sub = [videos.length > 1 ? '视频 ' + (vi + 1) : '', v.duration ? fmtDur(v.duration) + ' 秒' : '', dims].filter(Boolean).join(' · ');
    card.innerHTML = '<div class="vhead"><b>选择清晰度</b><span>' + sub + '</span></div>';
    qs.forEach((q, qi) => {
      const m = q.url.match(/(\d+)x(\d+)\.mp4/i) || (q.url.match(/vid\/(?:avc1\/)?(\d+x\d+)/i));
      const label = m ? m[1] : (q.bitrate / 1e6).toFixed(1) + ' Mbps';
      const row = document.createElement('div');
      row.className = 'q';
      const codec = q.codec ? q.codec.toUpperCase() : 'MP4';
      row.innerHTML =
        '<div class="info"><div class="res"></div><div class="meta"></div><div class="bar hidden"><i></i></div></div>' +
        '<a class="open" href="' + q.url + '" target="_blank" rel="noopener">打开</a>' +
        '<button class="dl" type="button">下载</button>';
      row.querySelector('.res').textContent = label.replace(/(\d+)x(\d+)/, (s, w, h) => Math.max(w, h) + 'p（' + w + 'x' + h + '）');
      const metaEl = row.querySelector('.meta');
      metaEl.textContent = codec + ' · ' + (q.bitrate / 1e6).toFixed(1) + ' Mbps · 大小获取中…';
      probeSize(q.url, metaEl, codec, q.bitrate);
      const fname = (a.screen_name || 'x') + '_' + tweetId + '_' + label.replace(/[^0-9x]/g, '') + '.mp4';
      row.querySelector('.dl').addEventListener('click', () => download(q.url, fname, row));
      card.appendChild(row);
    });
    result.appendChild(card);
  });
}

async function probeSize(url, el, codec, bitrate) {
  try {
    const r = await fetch(url, { method: 'HEAD' });
    const len = +r.headers.get('content-length');
    el.textContent = codec + ' · ' + (bitrate / 1e6).toFixed(1) + ' Mbps' + (len ? ' · 约 ' + fmtSize(len) : '');
  } catch (e) { /* 忽略，仅少显示大小 */ }
}

async function download(url, filename, row) {
  const btn = row.querySelector('.dl');
  const bar = row.querySelector('.bar');
  const fill = bar.querySelector('i');
  btn.disabled = true; btn.textContent = '准备中…';
  bar.classList.remove('hidden');
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const total = +res.headers.get('content-length') || 0;
    const reader = res.body.getReader();
    const chunks = [];
    let received = 0;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      const pct = total ? Math.min(99, received / total * 100) : 0;
      fill.style.width = pct + '%';
      btn.textContent = (total ? pct.toFixed(0) + '%' : fmtSize(received));
    }
    fill.style.width = '100%';
    const blob = new Blob(chunks, { type: 'video/mp4' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 30000);
    btn.textContent = '已保存';
    setMsg('已保存：' + filename + '（' + fmtSize(blob.size) + '）。可在手机「文件/下载」中查看', true);
  } catch (e) {
    btn.textContent = '重试';
    btn.disabled = false;
    bar.classList.add('hidden');
    setMsg('下载失败：' + e.message + '。可点右侧「打开」后长按视频另存');
  }
}

$('parseBtn').addEventListener('click', parse);
input.addEventListener('keydown', e => { if (e.key === 'Enter') parse(); });
input.addEventListener('paste', () => setTimeout(parse, 50));
$('pasteBtn').addEventListener('click', async () => {
  try {
    const text = await navigator.clipboard.readText();
    if (text) { input.value = text.trim(); parse(); }
    else setMsg('剪贴板是空的，请先在 X App 里复制链接');
  } catch (e) {
    setMsg('无法读取剪贴板，请长按输入框手动粘贴');
    input.focus();
  }
});

const qp = new URLSearchParams(location.search).get('url');
if (qp) { input.value = qp; parse(); }
</script>
</body>
</html>
